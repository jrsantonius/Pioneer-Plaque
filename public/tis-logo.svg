<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <clipPath id="cc">
      <circle cx="200" cy="200" r="198"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>

  <!-- Base circle -->
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>

  <!-- Wavy fabric layers -->
  <g clip-path="url(#cc)">
    <path d="M-10 100 C60 60, 140 130, 210 90 C280 50, 340 110, 420 70 L420 200 C340 170, 280 220, 210 180 C140 140, 60 200, -10 170Z" fill="#c2c2c2" opacity="0.6"/>
    <path d="M-10 140 C70 100, 150 170, 220 130 C290 90, 360 150, 420 120 L420 250 C360 220, 290 270, 220 230 C150 190, 70 250, -10 210Z" fill="#b8b8b8" opacity="0.5"/>
    <path d="M-10 190 C80 150, 160 220, 240 180 C320 140, 370 200, 420 170 L420 300 C370 270, 320 320, 240 280 C160 240, 80 300, -10 260Z" fill="#cacaca" opacity="0.5"/>
    <path d="M-10 240 C90 200, 170 270, 250 230 C330 190, 380 250, 420 220 L420 350 C380 320, 330 370, 250 330 C170 290, 90 350, -10 310Z" fill="#bbb" opacity="0.4"/>
    <path d="M-10 290 C70 260, 150 320, 230 280 C310 240, 390 300, 420 270 L420 420 L-10 420Z" fill="#d0d0d0" opacity="0.35"/>

    <!-- Top waves -->
    <path d="M-10 30 C50 10, 120 60, 190 30 C260 0, 330 50, 420 20 L420 110 C330 90, 260 130, 190 100 C120 70, 50 120, -10 90Z" fill="#c5c5c5" opacity="0.45"/>
  </g>

  <!-- TIS text group — centered -->
  <g transform="translate(200, 235)" text-anchor="middle">
    <!-- T -->
    <g transform="translate(-80, 0)">
      <rect x="-22" y="-32" width="44" height="5" rx="1" fill="white"/>
      <rect x="-22" y="27" width="44" height="5" rx="1" fill="white"/>
      <rect x="-6" y="-32" width="12" height="59" fill="white"/>
    </g>

    <!-- I -->
    <rect x="-6" y="-32" width="12" height="59" fill="white"/>

    <!-- S -->
    <g transform="translate(80, 0)">
      <rect x="-22" y="-32" width="44" height="5" rx="1" fill="white"/>
      <rect x="-22" y="27" width="44" height="5" rx="1" fill="white"/>
      <!-- S shape -->
      <rect x="-18" y="-27" width="36" height="10" rx="2" fill="white"/>
      <rect x="-18" y="-27" width="10" height="25" rx="2" fill="white"/>
      <rect x="-18" y="-6" width="36" height="10" rx="2" fill="white"/>
      <rect x="8" y="0" width="10" height="27" rx="2" fill="white"/>
      <rect x="-18" y="17" width="36" height="10" rx="2" fill="white"/>
    </g>

    <!-- TM superscript -->
    <text x="115" y="-24" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="white" letter-spacing="1">TM</text>
  </g>
</svg>
