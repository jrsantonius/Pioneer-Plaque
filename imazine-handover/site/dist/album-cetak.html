/* ---------- template page ---------- */
.pg{position:relative;aspect-ratio:1000/1416;container-type:inline-size;overflow:hidden;background:#fff;isolation:isolate}
.pg-l{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slot{position:absolute;overflow:hidden;padding:0;border:0;margin:0;background:none;display:block;font:inherit;color:inherit}
.slot img{position:absolute;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.slot.is-empty{box-shadow:inset 0 0 0 .18cqw rgba(25,27,10,.34)}
.slot-lb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;font-family:var(--font-ui);font-weight:700;letter-spacing:.04em;color:rgba(25,27,10,.62);line-height:1.1;text-transform:uppercase}
.slot-plus{font-size:1.5em;font-weight:500;line-height:.8}
.tx{position:absolute;white-space:pre;line-height:1;padding:0;margin:0;border:0;background:none;text-align:left;transform-origin:0 84.7%;font-kerning:normal}
.tx-c{transform:translateX(-50%)}
.tx-r{transform:translateX(-100%)}
.tx-sp .tx-v{letter-spacing:.28em}
.tx-up .tx-v{text-transform:uppercase}
.cp{overflow:visible}
.pa{position:absolute;padding:0;margin:0;border:0;background:none;display:block;text-align:left;overflow:visible}
.pa-bar,.pa-rule{position:absolute;display:block}
.pa-rule{left:0;right:0;height:0}
.pa-t{position:absolute;top:0;left:0;right:0;min-height:100%;white-space:pre-wrap;overflow-wrap:break-word;color:#2b2b2b}
.cp-bar{position:absolute;display:block}

/* Mode pembayaran: tanpa kelas .pay di <html> (bawaan) pembayaran disembunyikan; /api/imazine/config payment:true menambahkan .pay */
html:not(.pay) [data-pay]{display:none!important}
html.pay [data-nopay]{display:none!important}

:root{--font-ui:"Manrope","Manrope Fallback",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#2b2724;color:#f4ede4;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.cv{display:block}
.st-d{font-family:"Bowlby One","Arial Black",Impact,sans-serif}
.st-s{font-family:var(--font-ui);font-weight:800;letter-spacing:.2em}
.bar{position:sticky;top:0;z-index:5;background:#13100e;border-bottom:1px solid #3a322c;padding:12px 16px}
.bar-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.bar a{color:#cf7a3c}
.bar h1{margin:0;font:400 22px Georgia,serif}
.bar .m,.bar .prog{margin:2px 0 0;color:#b9ada0;font-size:13px}
.act{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.act label{display:flex;gap:6px;align-items:center;color:#d8cfc5;font-size:13px}
.btn{padding:10px 18px;border-radius:999px;border:0;background:#cf7a3c;color:#1a0f06;font-weight:700;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:progress}
.how{max-width:1000px;margin:8px auto 0;color:#b9ada0;font-size:12.5px}
.how summary{cursor:pointer;color:#d8cfc5;width:max-content;max-width:100%}
.how p{margin:4px 0 0}
.warn{max-width:1000px;margin:8px auto 0;color:#ffb09f;font-size:13px}
.safari{max-width:1000px;margin:10px auto 0;padding:12px 14px;border-radius:10px;background:#4a1f14;border:1px solid #a8452c;color:#ffe3d8;font-size:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.safari p{margin:0;flex:1 1 420px}
.btn-line{background:none;border:1.5px solid #ffb09f;color:#ffe3d8}
.book{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px 80px}
.leaf{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
.lb{margin:0;color:#b9ada0;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sheet{width:210mm;height:297mm;max-width:calc(100vw - 32px);max-height:calc((100vw - 32px) * 297 / 210);background:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sheet .pg{width:100%;height:100%;aspect-ratio:auto}
.sheet .cv,.sheet.cover img{width:100%;height:100%;display:block;object-fit:cover}
/* tablet: bar tetap di atas, tapi lebih ringkas */
@media (max-width:1024px){
  .bar{padding:10px 20px}
  .book{padding:20px 20px 80px}
  .sheet{max-width:calc(100vw - 40px);max-height:calc((100vw - 40px) * 297 / 210)}
}
/* ponsel (dan ponsel mendatar): bar ikut tergulung, tombol simpan mengambang di bawah */
@media (max-width:760px),(max-height:600px){
  .bar{position:static;padding:12px 16px}
  .bar h1{font-size:20px}
  .act{width:100%}
  .book{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .sheet{max-width:calc(100vw - 32px);max-height:calc((100vw - 32px) * 297 / 210)}
  .leaf{margin-bottom:10px}
  #save{position:fixed;z-index:6;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));padding:14px 18px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
}
@media (max-height:600px) and (min-width:761px){
  .sheet{max-height:none}
  #save{left:auto;width:320px}
}
@page{size:210mm 297mm;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  .bar,.lb{display:none!important}
  .book{display:block;padding:0}
  .leaf{display:block;margin:0}
  .leaf+.leaf{break-before:page;page-break-before:always}
  /* Bingkai foto yang mepet tepi atas/bawah halaman (y < 0 atau y + h > 1416, ada di 10 dari 12 layout) membuat Chrome
     memecah bingkai itu di batas halaman cetak, lalu foto di dalamnya tidak terpotong dan meluber (PDF IMZ-BL39KY, 23 Nov 2026).
     contain:strict menjadikan tiap lembar satu kesatuan yang tidak dipecah, jadi hasil cetak sama dengan layar. */
  .sheet{width:210mm;height:297mm;max-width:none;max-height:none;box-shadow:none;contain:strict}
}

  }, Promise.reject()).catch(function (e) { heicLib = null; throw e; });   /* failed: try again on the next photo */
  return heicLib;
}
function jpegOf(src, w, h) {
  var k = Math.min(1, HEIC_MAX / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);
  return new Promise(function (res, rej) { c.toBlob(function (b) { c.width = c.height = 0; if (b) res(b); else rej(new Error('JPEG failed')); }, 'image/jpeg', HEIC_Q); });
}
function heicToJpeg(file) {
  var run = heicQueue.then(async function () {
    var blob, u = URL.createObjectURL(file);
    try { var img = await loadImg(u); blob = await jpegOf(img, img.naturalWidth, img.naturalHeight); }   /* Safari */
    catch (e) {
      var bmp = await (await heicReady())({ blob: file, type: 'bitmap' });
      try { blob = await jpegOf(bmp, bmp.width, bmp.height); } finally { if (bmp.close) bmp.close(); }
    } finally { URL.revokeObjectURL(u); }
    var name = (file.name || 'foto').replace(/\.(heic|heif)$/i, '') + '.jpg';
    return new File([blob], name, { type: 'image/jpeg', lastModified: file.lastModified || Date.now() });
  });
  heicQueue = run.catch(function () {});

}
async function intakeOne(file) {
  var head = await file.slice(0, 262144).arrayBuffer(), heic = isHeic(head, file);
  var date = (heic ? heicExifDate(head) : readExifDate(head)) || dateFromName(file.name || '');
  if (heic) file = await heicToJpeg(file);
  var src = URL.createObjectURL(file);
  try {
    var img = await loadImg(src);

    var small = await canvasBlob(big.canvas, THUMB_MAX, 0.8);   /* dari versi kecil: jauh lebih cepat daripada dari foto asli */
    big.canvas.width = big.canvas.height = 0;   /* lepaskan memori kanvas segera (penting di HP) */
    return { url: URL.createObjectURL(big.blob), thumb: URL.createObjectURL(small.blob), w: big.w, h: big.h, date: date, name: file.name || 'foto', dated: date ? 'file' : null, file: file };

}
async function intake(files, onStep) {

/* Sample pictures drawn on a canvas, so the flow can be tried without real photos. */
function samplePhotos(n) {
  var skies = [['#f7c59f', '#e4883a'], ['#bfe3df', '#3e787b'], ['#f9e2b6', '#e25a3c'], ['#d9e8c5', '#5f8f6b'], ['#f3d1dc', '#b65a7a'], ['#cfd9f0', '#51649c']];
  var shapes = [[4, 3], [3, 4], [1, 1], [3, 2], [4, 5], [16, 9], [2, 3]];
  var jobs = [];
  for (var i = 0; i < n; i++) (function (i) {
    var sh = shapes[i % shapes.length], w = sh[0] >= sh[1] ? 1200 : Math.round(1200 * sh[0] / sh[1]), hh = sh[0] >= sh[1] ? Math.round(1200 * sh[1] / sh[0]) : 1200;
    var c = document.createElement('canvas'); c.width = w; c.height = hh;
    var x = c.getContext('2d'), sk = skies[(i * 5 + 2) % skies.length];
    var g = x.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, sk[0]); g.addColorStop(1, sk[1]);
    x.fillStyle = g; x.fillRect(0, 0, w, hh);
    x.fillStyle = 'rgba(255,250,235,.85)'; x.beginPath(); x.arc(w * (0.2 + (i * 37 % 60) / 100), hh * (0.22 + (i * 13 % 20) / 100), Math.min(w, hh) * 0.09, 0, 7); x.fill();
    for (var k = 0; k < 3; k++) {
      x.fillStyle = 'rgba(25,27,10,' + (0.16 + k * 0.14) + ')';
      x.beginPath(); x.moveTo(0, hh);
      for (var px = 0; px <= w; px += w / 24) x.lineTo(px, hh * (0.58 + k * 0.12) + Math.sin(px / w * (5 + k * 2) + i * 1.7 + k) * hh * 0.06);
      x.lineTo(w, hh); x.closePath(); x.fill();
    }
    jobs.push(new Promise(function (res) {
      c.toBlob(function (b) {
        var t = document.createElement('canvas'), kk = THUMB_MAX / Math.max(w, hh);
        t.width = Math.round(w * kk); t.height = Math.round(hh * kk);
        t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
        t.toBlob(function (tb) {
          var d = new Date(2026, 6, 12 + Math.floor(i / Math.max(1, Math.ceil(n / 7))), 8 + (i % 9), (i * 7) % 60);
          res({ url: URL.createObjectURL(b), thumb: URL.createObjectURL(tb), w: w, h: hh, date: d, name: 'contoh-' + (i + 1) + '.jpg', sample: true, file: b });
        }, 'image/jpeg', 0.8);
      }, 'image/jpeg', 0.86);
    }));
  })(i);
  return Promise.all(jobs);
}

/* ---------- album model ---------- */
function newAlbum(tplId, photos) {
  var tpl = IMZ_TPL[tplId];
  return { tpl: tpl, photos: photos, pages: tpl.pages.map(function (p) {
    return { slots: p.ph.map(function () { return { photo: null, fx: 0.5, fy: 0.5, z: 1 }; }), tx: {}, pa: {}, cp: {}, mv: {}, z: {}, fmt: {} };
  }) };
}
function defaultFocus(photo, g) { return { fx: 0.5, fy: photo.w / photo.h < g[2] / g[3] ? 0.38 : 0.5, z: 1 }; }
function setSlot(album, pi, si, photoIdx) {
  var s = album.pages[pi].slots[si];
  s.photo = photoIdx;
  if (photoIdx != null) { var f = defaultFocus(album.photos[photoIdx], slotGeo(album, pi, si)); s.fx = f.fx; s.fy = f.fy; s.z = 1; }
}
function byDate(photos, idxs) {
  return idxs.slice().sort(function (a, b) {
    var da = photos[a].date, db = photos[b].date;
    if (da && db) return da - db || a - b;
    if (da) return -1;
    if (db) return 1;
    return a - b;
  });
}
/* Pour photos into empty slots in page order. Inside one page, pair each slot
   with the photo whose shape fits it best, so less of the picture is cropped. */
function pourPhotos(album, idxs) {
  var queue = byDate(album.photos, idxs), placed = 0;
  album.pages.forEach(function (pg, pi) {
    var empties = [];
    pg.slots.forEach(function (s, si) { if (s.photo == null) empties.push(si); });
    if (!empties.length || !queue.length) return;
    var take = queue.splice(0, empties.length), P = album.tpl.pages[pi];
    empties.slice(0, take.length)
      .sort(function (a, b) { return Math.abs(Math.log(P.ph[b][2] / P.ph[b][3])) - Math.abs(Math.log(P.ph[a][2] / P.ph[a][3])); })
      .forEach(function (si) {
        var want = Math.log(P.ph[si][2] / P.ph[si][3]), best = 0, bd = Infinity;
        take.forEach(function (pi2, k) { var d = Math.abs(Math.log(album.photos[pi2].w / album.photos[pi2].h) - want); if (d < bd) { bd = d; best = k; } });
        setSlot(album, pi, si, take.splice(best, 1)[0]);
        placed++;
      });
  });
  return placed;
}
function usage(album) {
  var u = album.photos.map(function () { return 0; });
  album.pages.forEach(function (pg) { pg.slots.forEach(function (s) { if (s.photo != null) u[s.photo]++; }); });
  return u;
}
function emptySlots(album) {
  var out = [];
  album.pages.forEach(function (pg, pi) { pg.slots.forEach(function (s, si) { if (s.photo == null) out.push([pi, si]); }); });
  return out;
}
/* Fill what is still empty by reusing photos: least-used first, never twice on one page when avoidable. */
function refill(album) {
  var u = usage(album), changed = [];
  emptySlots(album).forEach(function (e) {
    var onPage = album.pages[e[0]].slots.map(function (s) { return s.photo; });
    var best = -1;
    album.photos.forEach(function (p, i) {
      var clash = onPage.indexOf(i) > -1;
      if (best < 0) { best = i; return; }
      var bClash = onPage.indexOf(best) > -1;
      if (clash !== bClash ? !clash : u[i] < u[best]) best = i;
    });
    if (best < 0) return;
    setSlot(album, e[0], e[1], best);
    u[best]++;
    changed.push(e);
  });
  return changed;
}
function totals(album) {
  var total = 0, filled = 0, blankText = 0;
  album.pages.forEach(function (pg, pi) {
    var P = album.tpl.pages[pi];
    pg.slots.forEach(function (s) { total++; if (s.photo != null) filled++; });
    P.tx.forEach(function (t, i) { if (t.k === 'e' && !pg.tx[i]) blankText++; });
    P.pa.forEach(function (p, i) { if (!pg.pa[i]) blankText++; });
    P.cp.forEach(function (c, i) { if (c.bar && !captionValue(album, pi, i)) blankText++; });
  });
  return { total: total, filled: filled, empty: total - filled, blankText: blankText };
}
function paraLimit(pa) { var fs = Math.min(pa.lh * 0.52, 46); return Math.max(20, Math.floor(pa.w / (fs * 0.5)) * pa.n); }
function capLimit(cp) { return clamp(Math.floor(cp.w / (cp.z * 0.5)), 12, 60); }

/* ---------- Album cetak (admin) ------------------------------------------------
   Menyusun ulang album pesanan dari data pesanan + template, memakai renderPage()
   yang sama dengan yang dilihat pembeli, satu halaman A4 per lembar, lalu disimpan
   sebagai PDF lewat dialog cetak browser.
   Dibuka dari /imazine/admin/pesanan/{no}/album (wajib login admin).
   Data: {base}/data.json. Foto ukuran cetak: {base}/cetak/{idx}.
--------------------------------------------------------------------------- */
var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
var NO = (location.pathname.match(/\/pesanan\/(IMZ-[A-Z0-9]{6})\/album/) || [])[1];
var BASE = '/imazine/admin/pesanan/' + NO;
var LOAD_AT_ONCE = 3;   /* foto diproses server satu per satu (diperkecil ke ukuran cetak); jangan banjiri hosting */

var ui = { bar: $('#bar'), title: $('#t'), meta: $('#m'), prog: $('#prog'), warn: $('#warn'), save: $('#save'), cover: $('#with-cover'), book: $('#book') };

function asObj(v) {   /* PHP mengubah {} menjadi [] dan {"0":..} menjadi list; keduanya tetap bisa diindeks angka */
  var o = {};
  if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { if (v[k] != null) o[k] = v[k]; });
  return o;
}

function buildAlbum(order) {
  var tpl = IMZ_TPL[order.template];
  if (!tpl) throw new Error('Template "' + order.template + '" tidak dikenal.');
  var photos = (order.photos || []).map(function (p) {
    return { url: BLANK, w: p.width || 1, h: p.height || 1, date: p.date ? new Date(p.date + 'T00:00:00') : null };
  });
  var pages = tpl.pages.map(function (P, pi) {
    var pg = (order.pages || [])[pi] || {}, caps = asObj(pg.captions), cp = {};
    /* Keterangan tersimpan sudah final (termasuk tanggal otomatis). Yang tidak ada berarti sengaja kosong. */
    P.cp.forEach(function (c, i) { cp[i] = caps[i] != null ? String(caps[i]) : ''; });
    return {
      slots: P.ph.map(function (g, k) {
        var s = (pg.slots || [])[k] || {};
        var ok = s.photo != null && photos[s.photo];
        return { photo: ok ? s.photo : null, fx: s.focusX != null ? +s.focusX : 0.5, fy: s.focusY != null ? +s.focusY : 0.5, z: s.zoom ? +s.zoom : 1, g: Array.isArray(s.box) && s.box.length === 4 ? s.box.map(Number) : undefined };
      }),
      tx: asObj(pg.texts), pa: asObj(pg.paragraphs), cp: cp, mv: asObj(pg.moves), z: asObj(pg.layers), fmt: asObj(pg.styles)
    };
  });
  return { tpl: tpl, photos: photos, pages: pages };
}

function coverEl(order) {
  var cat = catOf(order.category);
  var cv = cat ? coverOf(cat, order.cover) : null;
  if (!cv) return null;
  if (cv.mag) { var mi = new Image(); mi.src = BASE + '/sampul'; mi.alt = ''; return mi; }   /* render Full HD dari server */
  if (cv.img) { var im = new Image(); im.src = IMZ_IMG[cv.img]; im.alt = ''; return im; }
  var t = document.createElement('template');
  t.innerHTML = stampCover(cv.name, (cat.id === 'travel' ? cv.g : cat.name) + ' · 2026', ART[cv.art]);
  return t.content.firstElementChild;
}

function leaf(label, sheet, cls) {
  var l = h('section', 'leaf' + (cls ? ' ' + cls : ''));
  l.appendChild(h('p', 'lb', label));
  l.appendChild(sheet);
  return l;
}

function render(order, album) {
  var coverLeaf = null, cv = coverEl(order);
  if (cv) {
    var cs = h('div', 'sheet cover'); cs.appendChild(cv);
    coverLeaf = leaf('Sampul (pratinjau, bukan file cetak sampul)', cs, 'leaf-cover');
  }
  var frag = document.createDocumentFragment();
  album.pages.forEach(function (st, pi) {
    var P = album.tpl.pages[pi];
    var pg = renderPage(album, pi, 'view');
    /* tandai tiap gambar dengan nomor fotonya; urutan .slot = urutan layer angka di template */
    var ks = P.ly.filter(function (l) { return typeof l === 'number'; });
    Array.prototype.forEach.call(pg.querySelectorAll('.slot'), function (slot, j) {
      var im = slot.querySelector('img'), s = st.slots[ks[j]];
      if (im && s && s.photo != null) { im.dataset.ph = s.photo; im.decoding = 'sync'; }
    });
    var sh = h('div', 'sheet'); sh.appendChild(pg);
    frag.appendChild(leaf('Halaman ' + (pi + 1), sh));
  });
  ui.book.textContent = '';
  ui.book.appendChild(frag);
  function syncCover() {
    if (!coverLeaf) return;
    /* dilepas dari DOM (bukan display:none) supaya tidak ada halaman kosong di awal PDF */
    if (ui.cover.checked) ui.book.insertBefore(coverLeaf, ui.book.firstChild);
    else if (coverLeaf.parentNode) coverLeaf.parentNode.removeChild(coverLeaf);
  }
  if (!coverLeaf) { ui.cover.checked = false; ui.cover.disabled = true; }
  ui.cover.addEventListener('change', syncCover);
  syncCover();
}

function loadOne(idx, tries) {
  return new Promise(function (res, rej) {
    var im = new Image();
    im.onload = function () { res(im); };
    im.onerror = function () { rej(new Error('gagal')); };
    im.src = BASE + '/cetak/' + idx + (tries ? '?r=' + tries : '');
  }).catch(function (e) {
    if (tries >= 2) throw e;
    return new Promise(function (r) { setTimeout(r, 1500 * (tries + 1)); }).then(function () { return loadOne(idx, tries + 1); });
  });
}

function loadPhotos(album) {
  var used = [], seen = {};
  album.pages.forEach(function (pg) { pg.slots.forEach(function (s) { if (s.photo != null && !seen[s.photo]) { seen[s.photo] = 1; used.push(s.photo); } }); });
  var done = 0, failed = [], odd = [], next = 0;
  function show() { ui.prog.textContent = 'Memuat foto ukuran cetak: ' + done + ' dari ' + used.length + (failed.length ? ' (' + failed.length + ' gagal)' : ''); }
  show();
  function worker() {
    if (next >= used.length) return Promise.resolve();
    var idx = used[next++];
    return loadOne(idx, 0).then(function (im) {
      var p = album.photos[idx];
      p.url = im.src;
      /* rasio harus sama dengan yang dilihat pembeli, kalau tidak crop-nya bergeser (mis. orientasi EXIF tidak terbaca) */
      var a = im.naturalWidth / im.naturalHeight, b = p.w / p.h;
      if (Math.abs(Math.log(a / b)) > 0.03) odd.push(idx + 1);
      Array.prototype.forEach.call(ui.book.querySelectorAll('img[data-ph="' + idx + '"]'), function (el) { el.src = im.src; });
    }, function () { failed.push(idx + 1); }).then(function () { done++; show(); return worker(); });
  }
  var workers = [];
  for (var i = 0; i < LOAD_AT_ONCE; i++) workers.push(worker());
  return Promise.all(workers).then(function () { return { used: used.length, failed: failed.sort(function (a, b) { return a - b; }), odd: odd.sort(function (a, b) { return a - b; }) }; });
}

function fail(msg) {
  ui.prog.textContent = '';
  ui.warn.hidden = false;
  ui.warn.textContent = msg;
}

function boot() {
  if (!NO) return fail('Alamat halaman tidak dikenal.');
  document.title = NO + ' album';
  $('#back').href = BASE;
  fetch(BASE + '/data.json', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
    if (r.status === 401) throw new Error('Sesi admin habis. Masuk lagi di /imazine/admin, lalu buka halaman ini lagi.');
    if (!r.ok) throw new Error('Data pesanan tidak bisa dibuka (HTTP ' + r.status + ').');
    return r.json();
  }).then(function (order) {
    var album = buildAlbum(order);
    var cat = catOf(order.category), lay = LAYOUTS[order.template];
    ui.title.textContent = 'Album ' + NO;
    ui.meta.textContent = [order.coverName ? 'Sampul ' + order.coverName : '', lay ? lay.name : order.template, album.pages.length + ' halaman A4', cat ? cat.name : '', order.status === 'lunas' ? 'lunas' : 'BELUM LUNAS'].filter(Boolean).join(' · ');
    render(order, album);
    return loadPhotos(album).then(function (r) {
      return (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { return r; });
    });
  }).then(function (r) {
    var notes = [];
    if (r.failed.length) notes.push('Foto nomor ' + r.failed.join(', ') + ' gagal dimuat dan akan kosong di PDF. Muat ulang halaman untuk mencoba lagi.');
    if (r.odd.length) notes.push('Foto nomor ' + r.odd.join(', ') + ' rasionya berbeda dari yang dilihat pembeli (mungkin orientasi foto). Periksa halamannya sebelum dicetak.');
    ui.prog.textContent = r.used + ' foto dimuat. Siap disimpan.';
    if (notes.length) { ui.warn.hidden = false; ui.warn.textContent = notes.join(' '); }
    ui.save.disabled = false;
  }).catch(function (e) { fail(e.message || String(e)); });
}

/* Petunjuk simpan PDF sesuai perangkat. iPadOS mengaku Mac, jadi dikenali dari layar sentuhnya. */
function setupHow() {
  var ua = navigator.userAgent, how = $('#how'), t = $('#how-t');
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  /* Safari di Mac: halaman dan foto tampil benar di layar, tapi "Simpan sebagai PDF" di Safari membuat sebagian halaman
     kosong secara acak (IMZ-BL39KY, 24 Nov 2026; Chrome mencetak data yang sama lengkap). Arahkan ke Chrome/Edge. */
  SAFARI_MAC = !ios && /Safari\//.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Firefox/.test(ua);
  var heavy = ' Album ini berisi banyak foto ukuran cetak, jadi HP atau tablet bisa kehabisan memori saat membuat PDF. Kalau gagal atau ada halaman kosong, buat PDF-nya dari komputer.';
  if (ios) t.innerHTML = 'Ketuk <b>Simpan sebagai PDF</b>. Di layar <b>Opsi Cetak</b>, ketuk ikon <b>Bagikan</b> (kotak dengan panah ke atas) lalu pilih <b>Simpan ke File</b>. Kalau ada pilihan ukuran kertas, pilih <b>A4</b>.' + heavy;
  else if (android) t.innerHTML = 'Ketuk <b>Simpan sebagai PDF</b>. Di layar cetak, pilih printer <b>Simpan sebagai PDF</b> di bagian atas, ukuran kertas <b>A4</b>, lalu ketuk tombol <b>PDF</b>.' + heavy;
  /* di layar lebar petunjuknya langsung terbuka; di layar kecil dilipat supaya halaman album cepat terlihat */
  how.open = !ios && !android && matchMedia('(min-width: 1025px) and (min-height: 601px)').matches;
  if (SAFARI_MAC) {
    var w = document.createElement('div'); w.className = 'safari';
    w.innerHTML = '<p><b>Jangan simpan PDF dari Safari.</b> Safari sering membuat sebagian halaman album ini kosong di PDF, walaupun di layar terlihat lengkap. Buka halaman ini di <b>Google Chrome</b> atau <b>Microsoft Edge</b>, lalu simpan PDF dari sana.</p>';
    var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'btn btn-line'; cp.textContent = 'Salin link halaman ini';
    cp.addEventListener('click', function () {
      var done = function () { cp.textContent = 'Link tersalin. Tempel di Chrome atau Edge.'; };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, function () { prompt('Salin link ini:', location.href); });
      else prompt('Salin link ini:', location.href);
    });
    w.appendChild(cp);
    $('#bar').appendChild(w);
    ui.save.textContent = 'Simpan PDF di Safari (tidak disarankan)';
  }
}
var SAFARI_MAC = false;

setupHow();
ui.save.addEventListener('click', function () {
  if (SAFARI_MAC && !confirm('Di Safari, sebagian halaman PDF bisa kosong. Sebaiknya simpan dari Chrome atau Edge. Tetap lanjut di Safari?')) return;
  window.print();
});
document.body.insertAdjacentHTML('beforeend', stampDefs());
boot();

})();
